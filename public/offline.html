<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline - Smart Cookbook</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b0b0f;
      color: #e4e4e7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
    }
    .offline-card {
      text-align: center;
      max-width: 320px;
    }
    .offline-icon { margin-bottom: 24px; }
    .offline-card h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
    }
    .offline-card p {
      font-size: 15px;
      line-height: 1.5;
      color: #a1a1aa;
      margin-bottom: 24px;
    }
    .offline-card .btn {
      display: inline-block;
      padding: 10px 24px;
      border-radius: 10px;
      background: #22c55e;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">
      <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 3.11A10 10 0 0 1 21.9 8.9M5 12a7 7 0 0 1 9.18-6.64"/><path d="M16.3 6.33A5 5 0 0 1 19.9 12"/><path d="M8.53 16.11a6 6 0 0 1 8.3-7.1"/><path d="M12 15a3 3 0 0 1 2.37 1.14"/><path d="M9.88 18.05A3.5 3.5 0 0 1 12 17c.78 0 1.5.25 2.09.68"/><path d="M6 15a2 2 0 0 1 2.88-1.8"/><path d="M3.7 11.4A9 9 0 0 1 4 10"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Saved recipes are still available. AI features and URL import need an internet connection.</p>
    <a href="/" class="btn">Go to Recipes</a>
  </div>
</body>
</html>
